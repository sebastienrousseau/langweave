name: 🧪 Audit

on:
  push:
    branches:
      - main
      - feat/langweave
  pull_request:
    branches:
      - feat/langweave
  release:
    types: [created]

jobs:
  dependencies:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve dependencies
        run: cargo update

      - name: Audit vulnerabilities (strict enforcement)
        run: |
          echo "🔍 Running security audit with strict enforcement..."
          echo "🚫 NO SECURITY BYPASSES ALLOWED"
          cargo audit
          # CRITICAL: This step MUST fail on vulnerabilities - no '|| true' allowed
          echo "✅ No security vulnerabilities found."
